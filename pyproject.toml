[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noetiko-convergence"
version = "0.1.0"
description = "Reproducibility toolkit for the Noetiko Convergence trilogy (Papers I–III): operational phase-coordination, surrogates, and switching statistics."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "Andre Kappe", email = "andre.kappe@noetiko.tech"},
]
keywords = ["open systems", "metastability", "phase extraction", "Kuramoto", "surrogate data", "stochastic resonance", "falsifiability"]
classifiers = [
  	license-files = ["LICENSE", "NOTICE"],
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
paper1-quantum = ["qutip>=4.7"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/<your-org-or-user>/<repo>"
Repository = "https://github.com/<your-org-or-user>/<repo>"
DOI = "https://doi.org/10.5281/zenodo.<placeholder>"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
