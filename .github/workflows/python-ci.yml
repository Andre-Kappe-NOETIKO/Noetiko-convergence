name: python-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint:
    name: Py${{ matrix.python-version }} • pytest + ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip wheel setuptools

      # Install your package in editable mode
      - name: Install project
        run: |
          python -m pip install -e .

      # Install CI tools (keep explicit so CI is self-contained)
      - name: Install test & lint tools
        run: |
          python -m pip install pytest ruff

      - name: Ruff (lint)
        run: |
          ruff check .

      # If you use Ruff formatter, keep this on; otherwise remove this step.
      - name: Ruff (format check)
        run: |
          ruff format --check .

      - name: Pytest
        run: |
          pytest -q

  # Optional static typing. Enable by removing the "if: false" line OR switching it to true.
  mypy:
    name: Optional • mypy
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + mypy
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e .
          python -m pip install mypy

      - name: Mypy
        run: |
          mypy .
